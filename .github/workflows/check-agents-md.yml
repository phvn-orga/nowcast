# baudrier check-agents-md CI job, version 2.
#
# Checks every AGENTS.md and CLAUDE.md, with the amendment limits measured from
# the pull request's base, or from the default branch on a push or a manual
# run. GitHub Actions; translate it to the project's CI if it uses another one.
name: Agent instructions

on:
  pull_request:
  # The release workflow runs this check on the version and formula branches
  # it pushes: a pull request opened with GITHUB_TOKEN starts no workflow.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Runs when an instruction file changes, or when a file is deleted or
  # renamed anywhere: the check verifies that the paths they cite exist. A
  # job skipped here counts as passed for a required check. (Added to
  # baudrier's job: keep it through an upgrade.)
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.changes.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          run=$(.github/scripts/changed.sh --or-removed '*AGENTS.md' '*CLAUDE.md' \
            scripts/check-agents-md.mjs .github/workflows/check-agents-md.yml)
          echo "run=$run" >> "$GITHUB_OUTPUT"

  check-agents-md:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The amendment limits diff against the base branch.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Check AGENTS.md and CLAUDE.md
        env:
          BASE: origin/${{ github.base_ref || github.event.repository.default_branch }}
        run: node scripts/check-agents-md.mjs --base "$BASE"
