name: Release

# A release starts when the workspace version in Cargo.toml changes on main: a
# pull request raising it releases it once merged.
#
# Nothing shows before all is validated: the run builds the static binary in
# the release container, packages it, and installs the formula from the local
# archive. It then publishes the release whole (a draft completed, then
# published, which creates the tag), and only then points the Homebrew formula
# at it, through a pull request set to merge itself once its checks pass. GitHub
# holds the runs of a pull request opened with GITHUB_TOKEN until a maintainer
# approves them: that approval is the one step by hand, and the run does not
# wait for it.
#
# Run again (Re-run, or `gh workflow run release.yml`), it validates again,
# keeps a release already published, and redoes the formula.
#
# A pull request touching the release path runs the validation alone, and
# refuses a version that does not go up or is already released.
on:
  push:
    branches: [main]
    paths: [Cargo.toml]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/scripts/version-goes-up.py
      - Formula/**
      - build/**
      - .dockerignore
      - crates/daemon/systemd/**
      # The version, and a new dependency, which can break the static build.
      - Cargo.toml
      - Cargo.lock

permissions: {}

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-musl

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read the version, and whether it releases
        id: version
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.base_ref }}
        run: |
          # The first `version` of Cargo.toml is the workspace's.
          version_at() {
            git show "$1:Cargo.toml" | sed -n '0,/^version = "\(.*\)"$/s//\1/p'
          }
          version=$(version_at HEAD)
          released=$(git ls-remote --tags origin "v$version")
          case $GITHUB_EVENT_NAME in
            pull_request)
              previous=$(version_at "origin/$BASE")
              if [ "$previous" != "$version" ]; then
                if ! python3 -I .github/scripts/version-goes-up.py "$previous" "$version"; then
                  echo "::error::the version goes from $previous to $version: it must go up"
                  exit 1
                fi
                if [ -n "$released" ]; then
                  echo "::error::v$version is already released"
                  exit 1
                fi
              fi
              release=false
              ;;
            push)
              previous=$(version_at "$BEFORE")
              release=$([ "$previous" != "$version" ] && echo true || echo false)
              ;;
            workflow_dispatch)
              release=true
              ;;
          esac
          echo "$version, release: $release"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: github.event_name == 'pull_request' || needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      archive: ${{ steps.package.outputs.archive }}
      sha: ${{ steps.package.outputs.sha }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The same container builds the binary locally: see its header.
      - run: docker build -f build/release.Dockerfile --output out .
      - name: Package
        id: package
        run: |
          name="nowcast-v$VERSION-$TARGET"
          mkdir -p "dist/$name"
          cp out/nowcast README.md "dist/$name/"
          test "$("dist/$name/nowcast" --version)" = "nowcast $VERSION"
          tar -C dist --owner=0 --group=0 --numeric-owner -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/$name.tar.gz"
          sha256=$(cut -d ' ' -f 1 "dist/$name.tar.gz.sha256")
          sed -e "s|^  url \".*\"$|  url \"$url\"|" -e "s|^  sha256 \".*\"$|  sha256 \"$sha256\"|" \
            Formula/nowcast.rb > dist/nowcast.rb
          grep -qF "$url" dist/nowcast.rb && grep -qF "$sha256" dist/nowcast.rb
          ls -l "dist/$name/nowcast" "dist/$name.tar.gz"
          echo "archive=$name.tar.gz" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install the formula from the local archive
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          tap="$RUNNER_TEMP/tap"
          mkdir -p "$tap/Formula"
          sed "s|^  url \".*\"$|  url \"file://$PWD/dist/$ARCHIVE\"|" dist/nowcast.rb > "$tap/Formula/nowcast.rb"
          git -C "$tap" init -q
          git -C "$tap" add .
          git -C "$tap" -c user.name=ci -c user.email=ci@localhost commit -qm formula
          brew tap nowcast/dry-run "$tap"
          brew style nowcast/dry-run/nowcast
          # As in the README: the fully qualified name trusts this formula alone.
          brew install nowcast/dry-run/nowcast
          brew audit --formula nowcast/dry-run/nowcast
          brew test nowcast/dry-run/nowcast
          # The units `nowcast setup` writes run the binary from the opt path,
          # here with a systemctl that does nothing.
          fake="$RUNNER_TEMP/fake"
          mkdir -p "$fake/bin"
          printf '#!/bin/sh\n' > "$fake/bin/systemctl"
          chmod +x "$fake/bin/systemctl"
          PATH="$fake/bin:$PATH" XDG_CONFIG_HOME="$fake/config" XDG_DATA_HOME="$fake/data" \
            nowcast setup < /dev/null
          grep -x "ExecStart=$(brew --prefix)/opt/nowcast/bin/nowcast daemon" "$fake/config/systemd/user/nowcast.service"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    needs: [version, build]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      # Create and publish the release.
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
      ARCHIVE: ${{ needs.build.outputs.archive }}
      SHA: ${{ needs.build.outputs.sha }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: ${{ runner.temp }}/dist
      - name: Publish the release whole
        run: |
          tag="v$VERSION"
          if [ "$(gh release view "$tag" --json isDraft -q .isDraft 2>/dev/null)" = false ]; then
            echo "$tag is already published: kept"
            exit 0
          fi
          # A draft an earlier run left behind: nobody sees it, it goes.
          gh release delete "$tag" --yes 2>/dev/null || true
          # A version with a pre-release part (0.1.0-alpha.2) is published as
          # a pre-release, with a warning in place of the generated notes.
          flags=(--generate-notes)
          if [[ $VERSION == *-* ]]; then
            flags=(--prerelease --notes "**Experimental pre-release, for testing only.** Interfaces, formats and behaviour change without notice. Do not rely on it.")
          fi
          # Completed as a draft, then published: the tag, on the commit the
          # binary was built from, appears only with the whole release.
          if ! gh release create "$tag" --draft --target "$SHA" --title "nowcast $VERSION" "${flags[@]}" \
              "$RUNNER_TEMP/dist/$ARCHIVE" "$RUNNER_TEMP/dist/$ARCHIVE.sha256" ||
            ! gh release edit "$tag" --draft=false; then
            gh release delete "$tag" --yes --cleanup-tag || true
            echo "::error::$tag could not be published: nothing is left of it"
            exit 1
          fi

  formula:
    needs: [version, publish]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      # Push the formula branch.
      contents: write
      # Open the formula pull request and set it to merge itself.
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Point the formula at the release in a pull request
        run: |
          tag="v$VERSION"
          # The published archive, not this run's build: a release kept from
          # an earlier run has its own checksum.
          gh release download "$tag" --pattern '*.tar.gz.sha256' --dir "$RUNNER_TEMP/release"
          read -r sha256 archive < "$RUNNER_TEMP"/release/*.sha256
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$archive"
          sed -i -e "s|^  url \".*\"$|  url \"$url\"|" -e "s|^  sha256 \".*\"$|  sha256 \"$sha256\"|" \
            Formula/nowcast.rb
          if git diff --quiet Formula/nowcast.rb; then
            echo "the formula already points at $tag"
            exit 0
          fi
          branch="formula/$tag"
          title="build(formula): release nowcast $VERSION"
          git switch -c "$branch"
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qam "$title"
          # The branch is this workflow's: a run again replaces it, and takes
          # over its pull request.
          git push --force origin "$branch"
          gh pr view "$branch" --json state -q .state 2>/dev/null | grep -qx OPEN ||
            gh pr create --base main --head "$branch" --title "$title" \
              --body "Points the Homebrew formula at the $tag release, so that \`brew upgrade\` sees it. Opened by the release workflow: approve its runs, and it merges itself once its checks pass."
          gh pr merge "$branch" --auto --squash
