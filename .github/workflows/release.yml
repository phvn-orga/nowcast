name: Release

# One action releases: `gh workflow run release.yml -f version=<version>`.
# The run opens the pull request that sets the version in Cargo.toml and
# merges it once its checks pass, builds the static binary from the merge,
# tags it and publishes it as a GitHub Release, then opens and merges the pull
# request that points the Homebrew formula at it. Run again with the same
# version after a failure, it skips what is already done up to the release.
# A pull request touching the release path runs the same build and packaging,
# installs the formula from the local archive, and publishes nothing.
on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, without the v (0.1.0-alpha.2)
        required: true
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Formula/**
      - build/**
      - .dockerignore
      - crates/daemon/systemd/**
      # A new dependency can break the static build.
      - Cargo.lock

permissions: {}

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-musl

jobs:
  version:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      # Push the version branch.
      contents: write
      # Open and merge the version pull request.
      pull-requests: write
      # Run CI on that branch: a pull request opened by GITHUB_TOKEN starts no workflow.
      actions: write
    outputs:
      sha: ${{ steps.merge.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: dtolnay/rust-toolchain@stable
      - name: Set the version and merge it
        id: merge
        run: |
          if ! [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::$VERSION is not a version (0.1.0, 0.1.0-alpha.2)"
            exit 1
          fi
          if [ -n "$(git ls-remote --tags origin "v$VERSION")" ]; then
            echo "::error::v$VERSION is already released"
            exit 1
          fi
          current=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "nowcast-cli") | .version')
          # A run again after a failure further on: main already has it.
          if [ "$current" != "$VERSION" ]; then
            branch="release/v$VERSION"
            title="build(release): set the version to $VERSION"
            # The first `version` of Cargo.toml is the workspace's.
            sed -i "0,/^version = \".*\"$/s//version = \"$VERSION\"/" Cargo.toml
            cargo update --workspace
            git switch -c "$branch"
            git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qam "$title"
            git push origin "$branch"
            gh workflow run ci.yml --ref "$branch"
            gh workflow run check-agents-md.yml --ref "$branch"
            gh pr create --base main --head "$branch" --title "$title" \
              --body "Opened by the release workflow, which merges it once its checks pass."
            .github/scripts/merge-when-green.sh "$branch"
            git fetch -q origin main
          fi
          echo "sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    # The version job runs for a release only; a pull request builds alone.
    if: ${{ !cancelled() && (needs.version.result == 'success' || needs.version.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      archive: ${{ steps.package.outputs.archive }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha || github.sha }}
          persist-credentials: false
      # For `cargo metadata` alone: the binary builds in the container below.
      - uses: dtolnay/rust-toolchain@stable
      - name: Version
        id: version
        env:
          INPUT: ${{ inputs.version }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "nowcast-cli") | .version')
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$INPUT" != "$version" ]; then
            echo "::error::the merged version is $version, not $INPUT"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # The same container builds the binary locally: see its header.
      - run: docker build -f build/release.Dockerfile --output out .
      - name: Package
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          name="nowcast-v$VERSION-$TARGET"
          mkdir -p "dist/$name/systemd"
          cp out/nowcast README.md "dist/$name/"
          cp crates/daemon/systemd/nowcast.socket crates/daemon/systemd/nowcast.service "dist/$name/systemd/"
          test "$("dist/$name/nowcast" --version)" = "nowcast $VERSION"
          tar -C dist --owner=0 --group=0 --numeric-owner -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/$name.tar.gz"
          sha256=$(cut -d ' ' -f 1 "dist/$name.tar.gz.sha256")
          sed -e "s|^  url \".*\"$|  url \"$url\"|" -e "s|^  sha256 \".*\"$|  sha256 \"$sha256\"|" \
            Formula/nowcast.rb > dist/nowcast.rb
          grep -qF "$url" dist/nowcast.rb && grep -qF "$sha256" dist/nowcast.rb
          ls -l "dist/$name/nowcast" "dist/$name.tar.gz"
          echo "archive=$name.tar.gz" >> "$GITHUB_OUTPUT"
      - name: Install the formula from the local archive
        if: github.event_name == 'pull_request'
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          tap="$RUNNER_TEMP/tap"
          mkdir -p "$tap/Formula"
          sed "s|^  url \".*\"$|  url \"file://$PWD/dist/$ARCHIVE\"|" dist/nowcast.rb > "$tap/Formula/nowcast.rb"
          git -C "$tap" init -q
          git -C "$tap" add .
          git -C "$tap" -c user.name=ci -c user.email=ci@localhost commit -qm formula
          brew tap nowcast/dry-run "$tap"
          brew style nowcast/dry-run/nowcast
          # As in the README: the fully qualified name trusts this formula alone.
          brew install nowcast/dry-run/nowcast
          brew audit --formula nowcast/dry-run/nowcast
          brew test nowcast/dry-run/nowcast
          unit="$(brew --prefix)/opt/nowcast/share/nowcast/systemd/nowcast.service"
          grep -x "ExecStart=$(brew --prefix)/opt/nowcast/bin/nowcast daemon" "$unit"
          ! grep -F .local/bin "$unit"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/nowcast.rb
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Create the release, push the formula branch.
      contents: write
      # Open and merge the formula pull request.
      pull-requests: write
      # Run CI on that branch: a pull request opened by GITHUB_TOKEN starts no workflow.
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
      ARCHIVE: ${{ needs.build.outputs.archive }}
      SHA: ${{ needs.build.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: ${{ runner.temp }}/dist
      - name: Publish the release
        run: |
          # A version with a pre-release part (0.1.0-alpha.1) is published as
          # a pre-release, with a warning in place of the generated notes.
          flags=(--generate-notes)
          if [[ $VERSION == *-* ]]; then
            flags=(--prerelease --notes "**Experimental pre-release, for testing only.** Interfaces, formats and behaviour change without notice. Do not rely on it.")
          fi
          # Tags the commit the binary was built from.
          gh release create "v$VERSION" --target "$SHA" --title "nowcast $VERSION" "${flags[@]}" \
            "$RUNNER_TEMP/dist/$ARCHIVE" "$RUNNER_TEMP/dist/$ARCHIVE.sha256"
      - name: Point the formula at the release and merge it
        run: |
          branch="formula/v$VERSION"
          title="build(formula): release nowcast $VERSION"
          git switch -c "$branch"
          cp "$RUNNER_TEMP/dist/nowcast.rb" Formula/nowcast.rb
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qam "$title"
          git push origin "$branch"
          gh workflow run ci.yml --ref "$branch"
          gh workflow run check-agents-md.yml --ref "$branch"
          gh pr create --base main --head "$branch" --title "$title" \
            --body "Points the Homebrew formula at the v$VERSION release, so that \`brew upgrade\` sees it. Opened by the release workflow, which merges it once its checks pass."
          .github/scripts/merge-when-green.sh "$branch"
