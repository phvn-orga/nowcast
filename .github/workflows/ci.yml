name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The release workflow runs CI on the version and formula branches it
  # pushes: a pull request opened with GITHUB_TOKEN starts no workflow.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # What the change calls for. On main, every crate; on a pull request or a
  # branch the release workflow pushes, the crates it touches and those that
  # depend on them. A job skipped here counts as passed for a required check.
  changes:
    runs-on: ubuntu-latest
    outputs:
      crates: ${{ steps.changes.outputs.crates }}
      claude-code: ${{ steps.changes.outputs.claude-code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          echo "claude-code=$(.github/scripts/changed.sh 'clients/claude-code/*' .github/workflows/ci.yml)" >> "$GITHUB_OUTPUT"
          case $GITHUB_EVENT_NAME in
            push) crates=--workspace ;;
            pull_request) crates=$(git diff --name-only "$BASE_SHA...HEAD" | python3 -I .github/scripts/affected-crates.py) ;;
            *) crates=$(git diff --name-only origin/main...HEAD | python3 -I .github/scripts/affected-crates.py) ;;
          esac
          echo "crates: ${crates:-none}"
          echo "crates=$crates" >> "$GITHUB_OUTPUT"

  check:
    needs: changes
    if: needs.changes.outputs.crates != ''
    runs-on: ubuntu-latest
    env:
      CRATES: ${{ needs.changes.outputs.crates }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # Word splitting is meant: $CRATES holds several arguments.
      - run: cargo clippy $CRATES --all-targets -- -D warnings
      - run: cargo test $CRATES

  claude-code:
    needs: changes
    if: needs.changes.outputs.claude-code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/claude-code
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/claude-code/package-lock.json
      # ni picks the package manager from the lockfile; npm only bootstraps it.
      - run: npm install --global @antfu/ni@30.6.0
      - run: nci
      # The plugin API's types come from the Claude Code binary, which lays
      # them beside a mod it loads.
      - run: nr types
      - run: nr typecheck
      - run: nr validate
      - run: nr test
