name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # What the change calls for: on a pull request, or a manual run on a
  # branch, each job runs whole if its part changed, and not at all
  # otherwise; on main, every job runs. A job skipped here counts as passed
  # for a required check.
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.changes.outputs.rust }}
      claude-code: ${{ steps.changes.outputs.claude-code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "claude-code=true" >> "$GITHUB_OUTPUT"
            exit
          fi
          # The crates, the client kinds the binary embeds, the workspace.
          rust=$(.github/scripts/changed.sh 'crates/*' 'bricks/*' 'clients/*/*.toml' \
            Cargo.toml Cargo.lock .github/workflows/ci.yml)
          claude_code=$(.github/scripts/changed.sh 'clients/claude-code/*' .github/workflows/ci.yml)
          echo "rust: $rust, claude-code: $claude_code"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "claude-code=$claude_code" >> "$GITHUB_OUTPUT"

  check:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  claude-code:
    needs: changes
    if: needs.changes.outputs.claude-code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/claude-code
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/claude-code/package-lock.json
      # ni picks the package manager from the lockfile; npm only bootstraps it.
      - run: npm install --global @antfu/ni@30.6.0
      - run: nci
      # The plugin API's types come from the Claude Code binary, which lays
      # them beside a mod it loads.
      - run: nr types
      - run: nr typecheck
      - run: nr validate
      - run: nr test
