[package]
name = "nowcast-brick-system"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
futures = "0.3.34"
libc = "0.2.191"
nowcast-codec = { path = "../../crates/codec" }
nowcast-types = { path = "../../crates/types" }
rustix = { version = "1.1.6", features = ["fs"] }
serde_json = "1.0.154"
socket2 = "0.6.5"
sysinfo = { version = "0.40.3", default-features = false, features = ["system"] }
tokio = { version = "1.54.1", features = ["rt", "io-std", "io-util", "macros", "sync", "time", "process"] }
wl-nl80211 = "0.9.0"

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
nowcast-brick-build = { path = "../../crates/brick-build" }
