# The forge brick, native to nowcast: `nowcast bricks enable forge` writes
# this file and its schemas under $XDG_DATA_HOME/nowcast/bricks/ and
# activates it. The program `nowcast` is the service's own executable.
manifest_version = 1
name = "forge"
# The binary embeds this file with the workspace version in its place.
version = "0.0.0"
description = "A branch's PR and its pipelines, per job, on GitHub."
protocol = 1

[run]
command = ["nowcast", "brick", "forge"]

[subscriptions.pr]
description = "A branch's PR, open first, with the rollup of its CI."
schema = "schemas/params-branch.json"
publishes = "forge.pr/v1"

[subscriptions.pipelines]
description = "The pipelines that tested a branch's head, those of its PR included, with their jobs."
schema = "schemas/params-branch.json"
publishes = "forge.pipelines/v1"

[types."forge.pr/v1"]
schema = "schemas/pr-v1.json"

[types."forge.pipelines/v1"]
schema = "schemas/pipelines-v1.json"
