# The forge brick, native to nowcast: `nowcast bricks enable forge` writes
# this file and its schemas under $XDG_DATA_HOME/nowcast/bricks/ and
# activates it. The program `nowcast` is the service's own executable.
manifest_version = 1
name = "forge"
# The binary embeds this file with the workspace version in its place.
version = "0.0.0"
description = "A branch's PR and its pipelines, per job, and a repository's issues, on GitHub and Azure DevOps."
protocol = 1

[run]
command = ["nowcast", "brick", "forge"]

# Where each forge's token comes from: run in the user's terminal by
# `nowcast bricks enable forge` and `nowcast bricks configure forge`.
[configure]
command = ["nowcast", "brick", "forge", "configure"]

[subscriptions.pr]
description = "A branch's PR, open first, or a PR by its number, with the rollup of its CI."
schema = "schemas/params-pr.json"
publishes = "forge.pr/v1"

[subscriptions.pipelines]
description = "The pipelines that tested the head of a branch, or of a PR by its number, those of its PR included, with their jobs."
schema = "schemas/params-pr.json"
publishes = "forge.pipelines/v1"

[subscriptions.issues]
description = "A repository's open issues, at most 200, the most recently created, those assigned to the account apart."
schema = "schemas/params-issues.json"
publishes = "forge.issues/v1"

[subscriptions.issue]
description = "One issue of a repository, open or closed."
schema = "schemas/params-issue.json"
publishes = "forge.issue/v1"

[types."forge.pr/v1"]
schema = "schemas/pr-v1.json"

[types."forge.pipelines/v1"]
schema = "schemas/pipelines-v1.json"

[types."forge.issues/v1"]
schema = "schemas/issues-v1.json"

[types."forge.issue/v1"]
schema = "schemas/issue-v1.json"
