[package]
name = "nowcast-brick-forge"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
jiff = { version = "0.2.39", default-features = false, features = ["std"] }
nowcast-codec = { path = "../../crates/codec" }
nowcast-types = { path = "../../crates/types" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "io-std", "io-util", "macros", "sync", "time", "process"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "io-std", "io-util", "macros", "sync", "time", "process", "net"] }
