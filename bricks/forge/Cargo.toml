[package]
name = "nowcast-brick-forge"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
cliclack = "0.5.7"
jiff = { version = "0.2.39", default-features = false, features = ["std"] }
nowcast-codec = { path = "../../crates/codec" }
nowcast-types = { path = "../../crates/types" }
oo7 = "0.7.0"
reqwest = { version = "0.13.5", default-features = false, features = ["gzip", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "io-std", "io-util", "macros", "sync", "time", "process"] }
toml = "1.2.0"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "io-std", "io-util", "macros", "sync", "time", "process", "net"] }

[build-dependencies]
nowcast-brick-build = { path = "../../crates/brick-build" }
