[package]
name = "nowcast-brick-claude-code"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
jiff = { version = "0.2.39", default-features = false, features = ["std"] }
notify = "8.2.1"
nowcast-codec = { path = "../../crates/codec" }
nowcast-types = { path = "../../crates/types" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "io-std", "io-util", "macros", "sync", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
nowcast-conformance = { path = "../../crates/conformance" }
nowcast-discovery = { path = "../../crates/discovery" }

[build-dependencies]
nowcast-brick-build = { path = "../../crates/brick-build" }
