# A type schema must exist.
manifest_version = 1
name = "forge"
version = "0.1.0"
description = "State of a PR and its CI on GitHub and Azure DevOps."
protocol = 1

[run]
command = ["bin/nowcast-forge", "--verbose"]
env = { RUST_LOG = "info" }

[subscriptions.pr]
description = "The PR of a branch and its CI checks."
schema = "schemas/subscription-pr.json"
publishes = "forge.pr/v1"

[types."forge.pr/v1"]
schema = "schemas/missing.json"
