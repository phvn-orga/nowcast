[package]
name = "nowcast-conformance"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
bytes = "1.12.1"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
nowcast-traits = { path = "../traits" }
nowcast-types = { path = "../types" }
rmpv = "1.3.1"
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "time", "net", "io-util", "sync", "process", "test-util", "macros"] }
