[package]
name = "nowcast-discovery"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
jsonschema = { version = "0.60.2", default-features = false }
notify = "8.2.1"
nowcast-traits = { path = "../traits" }
nowcast-types = { path = "../types" }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync"] }
toml = "1.2.0"
tracing = "0.1.44"

[dev-dependencies]
nowcast-conformance = { path = "../conformance" }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "macros", "time"] }
